<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: Object Manipulation & Destructuring</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --a3cida: #A3C1DA;
            --a3cida-light: #C5D8EB;
            --a3cida-pale: #E8F0F7;
            --a3cida-dark: #7FA3C4;
            --navy: #005B99;
            --navy-light: #0077BB;
            --navy-pale: #E0F0FA;
            --white: #FFFFFF;
            --cream: #F7FAFC;
            --text-dark: #1A2B3C;
            --text-medium: #4A6078;
            --text-light: #8AA0B8;
            --shadow-soft: 0 8px 32px rgba(0, 91, 153, 0.10);
            --shadow-hover: 0 16px 48px rgba(0, 91, 153, 0.15);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(160deg, var(--navy-pale) 0%, var(--a3cida-pale) 40%, var(--cream) 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeInDown 0.7s ease;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.05rem;
            color: var(--text-medium);
            font-weight: 300;
        }

        .header-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .htag {
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .htag-navy {
            background: var(--navy);
            color: white;
        }

        .htag-a3cida {
            background: var(--a3cida);
            color: var(--navy);
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 20px;
            animation: fadeInUp 0.7s ease both;
            border: 1px solid rgba(163, 193, 218, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--navy) 0%, var(--a3cida) 100%);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--a3cida) 0%, var(--a3cida-light) 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* ===== PRODUCT FORM ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            border: 2px solid var(--a3cida-pale);
            border-radius: var(--radius-sm);
            background: var(--cream);
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--a3cida);
            box-shadow: 0 0 0 4px rgba(163, 193, 218, 0.25);
            background: white;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(0, 91, 153, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 91, 153, 0.35);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--a3cida) 0%, var(--a3cida-light) 100%);
            color: var(--navy);
            box-shadow: 0 4px 16px rgba(163, 193, 218, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(163, 193, 218, 0.4);
        }

        /* ===== OUTPUT CARDS ===== */
        .output-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: linear-gradient(135deg, var(--white) 0%, var(--cream) 100%);
            border-radius: var(--radius-md);
            padding: 24px;
            border: 2px solid var(--a3cida-pale);
            transition: all 0.3s ease;
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--a3cida);
        }

        .result-card.navy-accent {
            border-color: var(--navy-pale);
        }

        .result-card.navy-accent:hover {
            border-color: var(--navy-light);
        }

        .result-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--a3cida);
        }

        .result-card.navy-accent .result-label .dot {
            background: var(--navy);
        }

        .code-block {
            background: var(--navy);
            color: var(--a3cida-light);
            padding: 16px;
            border-radius: var(--radius-sm);
            font-family: 'Space Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .code-block .key { color: var(--a3cida); }
        .code-block .string { color: #A3E8B8; }
        .code-block .number { color: #FFD700; }
        .code-block .boolean { color: #FF8C69; }

        .value-display {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--navy);
            background: var(--a3cida-pale);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-top: 10px;
        }

        /* ===== COMPARISON SECTION ===== */
        .compare-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .compare-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 24px;
            border: 2px solid;
            transition: all 0.3s ease;
        }

        .compare-card.original {
            border-color: var(--a3cida);
        }

        .compare-card.updated {
            border-color: var(--navy);
        }

        .compare-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .compare-header {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compare-header.original { color: var(--a3cida-dark); }
        .compare-header.updated { color: var(--navy); }

        .compare-badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-original {
            background: var(--a3cida-pale);
            color: var(--a3cida-dark);
        }

        .badge-updated {
            background: var(--navy-pale);
            color: var(--navy);
        }

        /* ===== JSON CARDS ===== */
        .json-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .json-card {
            background: var(--white);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 2px solid;
            transition: all 0.3s ease;
        }

        .json-card.original-json {
            border-color: var(--a3cida);
        }

        .json-card.updated-json {
            border-color: var(--navy);
        }

        .json-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .json-header {
            padding: 14px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .json-header.original-json {
            background: linear-gradient(135deg, var(--a3cida) 0%, var(--a3cida-light) 100%);
            color: var(--navy);
        }

        .json-header.updated-json {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: white;
        }

        .json-body {
            padding: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.8;
            color: var(--text-dark);
            background: var(--cream);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .json-body .key { color: var(--navy); font-weight: 700; }
        .json-body .string { color: #2E8B57; }
        .json-body .number { color: var(--navy-light); font-weight: 700; }

        /* ===== SUMMARY BAR ===== */
        .summary-bar {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            color: white;
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            animation: fadeInUp 0.7s ease 0.4s both;
            position: relative;
            overflow: hidden;
        }

        .summary-bar::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(163, 193, 218, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        .summary-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .summary-info p {
            font-size: 0.85rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .summary-stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--a3cida);
        }

        .stat-label {
            font-size: 0.72rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .header h1 { font-size: 2rem; }
            .compare-section { grid-template-columns: 1fr; }
            .json-grid { grid-template-columns: 1fr; }
            .summary-bar { flex-direction: column; text-align: center; }
            .summary-stats { width: 100%; justify-content: center; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-badge">🎯 Practice Task 2</div>
            <h1>Object Manipulation & Destructuring</h1>
            <p>Create, destructure, spread, and convert objects to JSON</p>
            <div class="header-tags">
                <span class="htag htag-navy">Object Literals</span>
                <span class="htag htag-a3cida">Spread Operator</span>
                <span class="htag htag-navy">JSON</span>
            </div>
        </div>

        <!-- Product Form -->
        <div class="card" style="animation-delay: 0.1s;">
            <div class="card-title">
                <div class="card-title-icon">🛍️</div>
                Product Catalog Input
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" id="pName" value="Wireless Headphones Pro">
                </div>
                <div class="form-group">
                    <label class="form-label">Price ($)</label>
                    <input type="number" class="form-input" id="pPrice" value="299.99">
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-input" id="pCategory" value="Electronics">
                </div>
                <div class="form-group">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-input" id="pStock" value="45">
                </div>
                <div class="form-group">
                    <label class="form-label">Rating (1-5)</label>
                    <input type="number" class="form-input" id="pRating" value="4.7" step="0.1" min="1" max="5">
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="processProduct()">
                    <span>⚡</span> Process Product
                </button>
                <button class="btn btn-secondary" onclick="resetDefault()">
                    <span>↺</span> Reset Default
                </button>
            </div>
        </div>

        <!-- Output Area -->
        <div id="output"></div>
    </div>

    <script>
        function processProduct() {
            // ===== STEP 1: Create Product Object =====
            const product = {
                name: document.getElementById('pName').value,
                price: parseFloat(document.getElementById('pPrice').value),
                category: document.getElementById('pCategory').value,
                stock: parseInt(document.getElementById('pStock').value),
                rating: parseFloat(document.getElementById('pRating').value)
            };

            // ===== STEP 2: Destructure name and price =====
            const { name, price } = product;

            // ===== STEP 3: Spread operator - create updated copy with new price =====
            const updatedProduct = { ...product, price: product.price * 0.85 };

            // ===== STEP 4: Convert both to JSON =====
            const originalJSON = JSON.stringify(product, null, 2);
            const updatedJSON = JSON.stringify(updatedProduct, null, 2);

            // ===== RENDER OUTPUT =====
            let html = '';

            // --- Section 1: Original Object & Destructuring ---
            html += `
                <div class="card" style="animation-delay: 0.15s;">
                    <div class="card-title">
                        <div class="card-title-icon" style="background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: white;">📦</div>
                        Original Object & Destructuring
                    </div>
                    <div class="output-grid">
                        <div class="result-card">
                            <div class="result-label"><div class="dot"></div>Product Object</div>
                            <div class="code-block">${formatObject(product)}</div>
                        </div>
                        <div class="result-card navy-accent">
                            <div class="result-label"><div class="dot"></div>Destructured Variables</div>
                            <div class="code-block">
<span class="key">const</span> { <span class="string">name</span>, <span class="string">price</span> } = product;

<span class="key">name</span>  → <span class="string">"${name}"</span>
<span class="key">price</span> → <span class="number">$${price.toFixed(2)}</span></div>
                        </div>
                    </div>
                </div>
            `;

            // --- Section 2: Comparison ---
            html += `
                <div class="card" style="animation-delay: 0.2s;">
                    <div class="card-title">
                        <div class="card-title-icon" style="background: linear-gradient(135deg, var(--a3cida) 0%, var(--a3cida-light) 100%);">🔄</div>
                        Spread Operator Comparison
                    </div>
                    <div class="compare-section">
                        <div class="compare-card original">
                            <div class="compare-header original">
                                📦 Original Product
                                <span class="compare-badge badge-original">Before</span>
                            </div>
                            <div class="code-block">${formatObject(product)}</div>
                            <div class="value-display">Price: $${product.price.toFixed(2)}</div>
                        </div>
                        <div class="compare-card updated">
                            <div class="compare-header updated">
                                ✨ Updated Product
                                <span class="compare-badge badge-updated">After Spread</span>
                            </div>
                            <div class="code-block">${formatObject(updatedProduct)}</div>
                            <div class="value-display">Price: $${updatedProduct.price.toFixed(2)} (15% off)</div>
                        </div>
                    </div>
                </div>
            `;

            // --- Section 3: JSON Strings ---
            html += `
                <div class="card" style="animation-delay: 0.25s;">
                    <div class="card-title">
                        <div class="card-title-icon" style="background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: white;">🌐</div>
                        JSON.stringify() Output
                    </div>
                    <div class="json-grid">
                        <div class="json-card original-json">
                            <div class="json-header original-json">
                                <span>📦 Original JSON</span>
                                <span style="font-size:0.7rem; opacity:0.8;">JSON.stringify(product)</span>
                            </div>
                            <div class="json-body">${highlightJSON(originalJSON)}</div>
                        </div>
                        <div class="json-card updated-json">
                            <div class="json-header updated-json">
                                <span>✨ Updated JSON</span>
                                <span style="font-size:0.7rem; opacity:0.8;">JSON.stringify(updated)</span>
                            </div>
                            <div class="json-body">${highlightJSON(updatedJSON)}</div>
                        </div>
                    </div>
                </div>
            `;

            // --- Section 4: Summary Bar ---
            html += `
                <div class="summary-bar">
                    <div class="summary-info">
                        <h3>Processing Complete</h3>
                        <p>All operations executed successfully</p>
                    </div>
                    <div class="summary-stats">
                        <div class="stat">
                            <div class="stat-value">5</div>
                            <div class="stat-label">Properties</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">2</div>
                            <div class="stat-label">Destructured</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">2</div>
                            <div class="stat-label">JSON Objects</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('output').innerHTML = html;
        }

        // Helper: Format object for display
        function formatObject(obj) {
            let lines = [];
            for (let [key, value] of Object.entries(obj)) {
                let valStr = typeof value === 'string' ? `<span class="string">"${value}"</span>` : `<span class="number">${value}</span>`;
                lines.push(`  <span class="key">${key}</span>: ${valStr},`);
            }
            return `{\n${lines.join('\n')}\n}`;
        }

        // Helper: Syntax highlight JSON
        function highlightJSON(json) {
            return json
                .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
                .replace(/: "([^"]+)"/g, ': <span class="string">"$1"</span>')
                .replace(/: (\d+\.?\d*)/g, ': <span class="number">$1</span>')
                .replace(/: (true|false)/g, ': <span class="boolean">$1</span>');
        }

        // Reset to default values
        function resetDefault() {
            document.getElementById('pName').value = 'Wireless Headphones Pro';
            document.getElementById('pPrice').value = '299.99';
            document.getElementById('pCategory').value = 'Electronics';
            document.getElementById('pStock').value = '45';
            document.getElementById('pRating').value = '4.7';
            processProduct();
        }

        // Run on load
        window.onload = processProduct;
    </script>
</body>
</html>
